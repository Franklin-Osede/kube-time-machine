# The "Friday afternoon kubectl apply" that breaks the rollout.
# Image tag 99.99 does not exist; pods will stick in ImagePullBackOff
# while the previous ReplicaSet keeps serving traffic (until the next
# manual nudge or until ReplicaSet retention kicks in).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ktm-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:99.99
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
