# Recreate strategy + replicas: 1 is load-bearing. The agent writes to a
# ReadWriteOnce PVC; a rolling update would briefly run two pods racing
# for the same volume and corrupt the storage. See ADR-0007.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ktm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ktm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ktm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ktm.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup makes the mounted PVC writable by the nonroot user. The
        # distroless `nonroot` user is UID 65532 — keep these aligned.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "ktm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --storage-dir=/var/lib/ktm
            - --interval={{ .Values.snapshot.intervalSeconds }}s
            - --full-every={{ .Values.snapshot.fullEvery }}
            - --burst-threshold={{ .Values.snapshot.burstThreshold }}
            - --retain-days={{ .Values.snapshot.retainDays }}
            {{- if .Values.agent.health.enabled }}
            - --health-addr={{ .Values.agent.health.addr }}
            {{- else }}
            # Explicitly empty: the binary defaults to :8080, so omitting the
            # flag would leave the health server running even though the chart
            # says it is disabled (no port, no probes, NetworkPolicy deny-all).
            - --health-addr=
            {{- end }}
            {{- if .Values.agent.excludeNamespaces }}
            - --exclude-namespaces={{ join "," .Values.agent.excludeNamespaces }}
            {{- end }}
            {{- if .Values.agent.watchResources }}
            - --watch-resources={{ join "," .Values.agent.watchResources }}
            {{- end }}
          {{- if .Values.agent.health.enabled }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ktm
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-data" (include "ktm.fullname" .)) }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
