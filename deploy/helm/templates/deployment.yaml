# Recreate and replicas: 1 are load-bearing: the store allows one writer, and
# a rolling update would briefly run two pods against the same ReadWriteOnce
# volume. See ADR-0007.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ktm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ktm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ktm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ktm.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the PVC writable by distroless `nonroot` (UID 65532).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "ktm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --storage-dir=/var/lib/ktm
            - --interval={{ .Values.snapshot.intervalSeconds }}s
            - --full-every={{ .Values.snapshot.fullEvery }}
            - --burst-threshold={{ .Values.snapshot.burstThreshold }}
            - --retain-days={{ .Values.snapshot.retainDays }}
            {{- /* Built from the port so server, probes and NetworkPolicy agree.
                   Disabled means an explicitly empty flag: the binary's
                   default would still start a server. */}}
            {{- if .Values.agent.health.enabled }}
            - --health-addr=:{{ .Values.agent.health.port }}
            {{- else }}
            - --health-addr=
            {{- end }}
            {{- if .Values.agent.excludeNamespaces }}
            - --exclude-namespaces={{ join "," .Values.agent.excludeNamespaces }}
            {{- end }}
            {{- if .Values.agent.watchResources }}
            - --watch-resources={{ join "," .Values.agent.watchResources }}
            {{- end }}
          {{- if .Values.agent.health.enabled }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ktm
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ktm.claimName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
