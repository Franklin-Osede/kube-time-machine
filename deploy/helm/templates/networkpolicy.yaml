{{- if .Values.networkPolicy.enabled -}}
# Ingress: the agent has no Service, but it exposes a health port for the
# kubelet's liveness/readiness probes. We allow ingress to exactly that
# port and nothing else, so probes succeed even on CNIs that subject
# node→pod traffic to NetworkPolicy (e.g. Cilium). The port serves only
# /healthz, /readyz and /metrics (counters) — never snapshot data — so this
# opens no confidential surface. When the health server is disabled, ingress
# stays deny-all.
#
# Egress: DNS plus allow-all to the rest of the cluster + internet, minus
# the cloud metadata service.
# A stricter "only kube-apiserver" rule is brittle across providers
# (apiserver endpoint moves between ClusterIP and external LB), so the
# MVP keeps egress wide and treats this NetworkPolicy as a clear
# ingress shield + an intent marker on egress. Tightening egress is
# a Phase 2 follow-up. See ADR-0007 for the trade-off.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ktm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ktm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.agent.health.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.agent.health.port }}
    {{- else }}
    []
    {{- end }}
  egress:
    # DNS — kube-dns / CoreDNS in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else (kube-apiserver, any other endpoint). Explicit
    # so that adding policyTypes: [Egress] above doesn't silently cut
    # the agent off from the API server.
    #
    # Except the cloud instance-metadata service, which can hand out node
    # credentials. The agent authenticates with its ServiceAccount token and
    # never needs it. Only the /32: other link-local addresses stay open, e.g.
    # NodeLocal DNSCache on 169.254.20.10.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
{{- end }}
