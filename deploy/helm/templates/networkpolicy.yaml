{{- if .Values.networkPolicy.enabled -}}
# Trade-offs and their consequences: values.yaml § NetworkPolicy, ADR-0007.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ktm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ktm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Only the health port, with no `from:` on purpose: probes come from the
  # kubelet on the node, and a pod or namespace selector blocks them on CNIs
  # such as Cilium. It serves no snapshot data.
  ingress:
    {{- if .Values.agent.health.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.agent.health.port }}
    {{- else }}
    []
    {{- end }}
  egress:
    # DNS — kube-dns / CoreDNS in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else, because the API server's address differs by provider
    # — except the cloud metadata service, which hands out node credentials
    # the agent never needs. Only the /32: other link-local addresses such as
    # NodeLocal DNSCache (169.254.20.10) stay reachable.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
{{- end }}
