{{- if .Values.rbac.create -}}
# Cluster-scoped and read-only (ADR-0007): rollback runs in the CLI under the
# user's own kubeconfig, so the agent never writes to the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ktm.clusterRoleName" . }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
rules:
  # Informers only list and watch; the agent never issues a get.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
  {{- with .Values.rbac.extraRules }}
  # Opt-in rules for agent.watchResources.
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
