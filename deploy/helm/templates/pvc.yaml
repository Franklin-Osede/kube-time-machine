{{- if and (not .Values.storage.create) (not .Values.storage.existingClaim) -}}
{{- fail "storage.create=false needs storage.existingClaim: the agent must have a PVC to write to" -}}
{{- end -}}
{{- if and .Values.storage.create (not .Values.storage.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ktm.claimName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktm.labels" . | nindent 4 }}
  {{- if .Values.storage.retain }}
  annotations:
    # Survive `helm uninstall`; see storage.retain.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
