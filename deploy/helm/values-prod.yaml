# Production overlay: only what differs from values.yaml. Everything not set
# here keeps the default, so this file cannot drift from it.
#
#   helm install ktm oci://ghcr.io/franklin-osede/charts/kube-time-machine \
#     -n ktm-system --create-namespace -f values-prod.yaml
#
# Not deployable as-is: replace the storage class placeholder first.

image:
  # Pinned rather than following the chart's appVersion, so a chart upgrade
  # never changes the running agent without an explicit edit here. 0.1.1
  # does not exist until the stable release; until then use the rc you
  # install (for example 0.1.1-rc.3).
  tag: "0.1.1"

snapshot:
  # Higher than the default: busy production clusters roll out often, and
  # 50 changes in a window would flush on routine deploys.
  burstThreshold: 100

storage:
  # Size from the measured size of one full snapshot times the full snapshots
  # retained (24 a day at the defaults), plus deltas. Keep enough free space
  # that retention can still write a full snapshot before GC runs.
  size: 50Gi
  # REQUIRED: a CSI StorageClass with encryption at rest (the history holds
  # ConfigMap contents in plaintext), volume expansion, and preferably
  # VolumeSnapshot support.
  storageClassName: REPLACE_WITH_ENCRYPTED_STORAGE_CLASS

agent:
  # 1Gi held a tested workload of about 50 MB of ConfigMap data on kind; see
  # docs/install.md, "Sizing memory". Measure your own before relying on it.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # To keep namespaces whose ConfigMaps hold credentials out of the history,
  # list ALL excluded namespaces here (a list replaces the default, it does
  # not extend it):
  # excludeNamespaces: [kube-system, kube-public, kube-node-lease, payments]
