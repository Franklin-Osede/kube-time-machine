# Default values for kube-time-machine, sized for a small cluster.

# nameOverride shortens the chart name in resource names.
# fullnameOverride bypasses the "<release>-<name>" pattern entirely.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/franklin-osede/ktm-agent
  tag: ""                # falls back to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []        # list of {name: <secret>} when pulling from a private registry

# The agent flushes every intervalSeconds; every fullEvery-th flush is a full
# snapshot, the rest are deltas (ADR-0002).
snapshot:
  intervalSeconds: 300
  fullEvery: 12
  # Flush early when this many changes accumulate before the next tick.
  # 0 = disabled.
  burstThreshold: 50
  # Delete snapshots older than this many days, checked before every flush.
  # The newest full snapshot before the cutoff is kept as an anchor so every
  # delta in the window stays reconstructable. 0 = keep everything.
  retainDays: 30

# Local PVC storage.
storage:
  create: true                 # false requires existingClaim
  size: 10Gi
  storageClassName: ""         # empty = use the cluster default
  # Keep the PVC on `helm uninstall`, so the recorded history survives. A kept
  # PVC must be deleted manually, or re-attached with existingClaim.
  retain: true
  # Bind to an existing PVC instead of creating one. When set, size,
  # storageClassName and retain are ignored.
  existingClaim: ""

agent:
  # Serves /healthz (liveness probe), /readyz (readiness probe) and /metrics.
  health:
    enabled: true
    port: 8080
  # Namespaces whose events are dropped before the buffer, keeping system
  # controller churn out of snapshots and blame.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  # Extra kinds to record via dynamic informers (experimental), as
  # "resource[.group]/version"; the version is required because the dynamic
  # client does no discovery. Each needs a matching rule in rbac.extraRules.
  watchResources: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# replicaCount is not exposed: the store allows exactly one writer.

serviceAccount:
  create: true                 # false requires name
  name: ""                     # if empty, defaults to the fullname
  # The agent needs no cloud identity (IRSA, Workload Identity); granting one
  # would undo the NetworkPolicy's metadata-service block.
  annotations: {}

# Cluster-scoped read-only RBAC. See ADR-0007.
rbac:
  create: true
  # Additional read-only rules for agent.watchResources. Example:
  # extraRules:
  #   - apiGroups: ["apps"]
  #     resources: ["statefulsets"]
  #     verbs: ["list", "watch"]
  extraRules: []

# NetworkPolicy (ADR-0007).
#
# Ingress allows only the health port, with no `from:` selector: kubelet probes
# come from the node, which some CNIs (Cilium) police, so a selector can block
# them. As a result /healthz, /readyz and /metrics are reachable cluster-wide;
# none of them serve snapshot data.
#
# Egress allows everything except the cloud metadata service
# (169.254.169.254); an apiserver-only rule is brittle across providers.
#
# Disable on clusters whose CNI does not enforce NetworkPolicy.
networkPolicy:
  enabled: true
