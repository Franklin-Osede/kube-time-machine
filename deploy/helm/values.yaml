# Default values for kube-time-machine.
# Every default is the one we'd ship in production for a small cluster.
# Where a value is load-bearing for correctness (not just preference),
# the comment says so explicitly.

# nameOverride shortens the chart name in resource names.
# fullnameOverride bypasses the "<release>-<name>" pattern entirely.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/franklin-osede/ktm-agent
  tag: ""                # falls back to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []        # list of {name: <secret>} when pulling from a private registry

# Snapshot cadence. The agent flushes a delta every `intervalSeconds`,
# and turns every `fullEvery`-th flush into a full reference snapshot
# (see ADR-0002).
snapshot:
  intervalSeconds: 300
  fullEvery: 12
  # Flush early when this many changes accumulate before the next periodic tick.
  # Useful during deploy storms to capture fine-grained history. 0 = disabled.
  burstThreshold: 50

# Local PVC storage. Cloud drivers are Phase 2 (see roadmap).
storage:
  create: true                 # set false to bring your own PVC and bind it via fullnameOverride
  size: 10Gi
  storageClassName: ""         # empty = use the cluster default

# The set of watched resources is fixed in MVP: Deployments and
# ConfigMaps. It is not a chart value because the agent hardcodes the
# typed informers (internal/agent/informers.go) and the ClusterRole
# hardcodes the matching rules (templates/role.yaml) — a value here would
# be silently ignored. Widening the set is Phase 2 P0 work that touches
# all three places together.

# Health endpoints for Kubernetes probes (/healthz liveness, /readyz readiness).
agent:
  health:
    enabled: true
    addr: ":8080"
    port: 8080
  # Namespaces to exclude from watching. Events from these namespaces are
  # dropped before reaching the buffer, preventing system controller churn
  # (e.g. kube-root-ca.crt rotations) from polluting snapshots and blame output.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  # Additional resource kinds to watch via dynamic informers (Phase 2).
  # Format: "resource.group/version". The typed informers cover Deployments
  # and ConfigMaps; add any other resource kinds here.
  # NOTE: the ClusterRole in role.yaml must grant get/list/watch for each
  # resource listed here, or the informers will fail to sync.
  watchResources:
    - statefulsets.apps/v1
    - services/v1
    - ingresses.networking.k8s.io/v1
    - horizontalpodautoscalers.autoscaling/v2
  # Pod resource requests/limits. Conservative defaults for a small cluster.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# IMPORTANT: replicaCount is not exposed. The agent writes to a
# ReadWriteOnce PVC; two concurrent writers would corrupt the storage.
# Scaling out is a Phase 2 concern (requires a storage backend that
# supports concurrent writers — see roadmap P1).

serviceAccount:
  create: true
  name: ""                     # if empty, defaults to the fullname
  annotations: {}              # e.g. IAM role annotations for IRSA on EKS

# Cluster-scoped read-only RBAC. See ADR-0007.
rbac:
  create: true

# NetworkPolicy: ingress deny-all, egress allows DNS + everything else
# (a stricter "only kube-apiserver" rule is brittle across cluster
# providers — see ADR-0007). Disable on clusters whose CNI does not
# enforce NetworkPolicy (vanilla kindnet, flannel without the addon).
networkPolicy:
  enabled: true
