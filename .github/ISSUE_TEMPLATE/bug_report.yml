name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use the process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: KTM version
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Mode A (local agent)
        - Mode B (Helm/in-cluster agent)
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove credentials, kubeconfigs, ConfigMap contents, and snapshot data.
    validations:
      required: true
