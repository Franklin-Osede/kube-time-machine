# End-to-end test against a real Kubernetes cluster.
#
# Separate from ci.yml because it costs minutes rather than seconds: it builds
# the agent image, boots a kind cluster, and drives the full product loop
# (install → record → mutate → reconstruct → blame → rollback). It runs on
# pull requests, on pushes to main, and on demand — not on every branch push.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: kind — install, record, reconstruct, blame, rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      # The runner ships Docker with buildx, so e2e.sh takes its BuildKit path
      # and builds the real release Dockerfile rather than the fallback.
      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Run E2E
        run: test/e2e/e2e.sh
