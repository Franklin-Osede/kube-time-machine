name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Format, vet, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 5m ./...

      - name: Vet
        run: go vet ./...

      - name: Build both binaries
        run: make build

  helm:
    name: Helm lint and render contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint deploy/helm

      - name: Render chart
        run: helm template ktm deploy/helm --namespace ktm-system >/dev/null

      - name: Verify health toggle contract
        run: |
          enabled="$(helm template ktm deploy/helm --namespace ktm-system)"
          grep -q -- '- --health-addr=:8080' <<<"$enabled"
          grep -q 'containerPort: 8080' <<<"$enabled"
          grep -q 'livenessProbe:' <<<"$enabled"
          grep -q 'readinessProbe:' <<<"$enabled"

          disabled="$(helm template ktm deploy/helm --namespace ktm-system --set agent.health.enabled=false)"
          grep -q -- '- --health-addr=$' <<<"$disabled"
          ! grep -q 'containerPort: 8080' <<<"$disabled"
          ! grep -q 'livenessProbe:' <<<"$disabled"
          ! grep -q 'readinessProbe:' <<<"$disabled"
