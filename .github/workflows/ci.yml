name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Format, vet, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race -count=1 -timeout 5m ./...

      - name: Vet
        run: go vet ./...

      - name: Build both binaries
        run: make build

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not 'latest': .golangci.yml uses the v2 config schema, and a
      # major-version jump would fail the job on config parsing rather than on
      # anything in the code. Dependabot proposes bumps.
      # Action major and linter major are coupled: golangci-lint-action v6
      # rejects any v2.x linter outright. Bump them together.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 'stable' rather than go-version-file: stdlib advisories are fixed by
      # toolchain patch releases, and go.mod pins only the 1.26.0 floor that
      # client-go requires. Scanning with the newest patched toolchain keeps
      # this job reporting module problems we can actually act on.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  helm:
    name: Helm lint and render contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint deploy/helm

      - name: Render chart
        run: helm template ktm deploy/helm --namespace ktm-system >/dev/null

      - name: Verify storage retention contract
        run: |
          # Default: a PVC is created and survives helm uninstall.
          default="$(helm template ktm deploy/helm --namespace ktm-system)"
          grep -q 'kind: PersistentVolumeClaim' <<<"$default"
          grep -q 'helm.sh/resource-policy: keep' <<<"$default"

          # retain=false: PVC still created, but Helm owns its lifecycle.
          ephemeral="$(helm template ktm deploy/helm --namespace ktm-system --set storage.retain=false)"
          grep -q 'kind: PersistentVolumeClaim' <<<"$ephemeral"
          ! grep -q 'helm.sh/resource-policy' <<<"$ephemeral"

          # existingClaim: no PVC is created, and the Deployment mounts the
          # named claim instead of the generated one.
          existing="$(helm template ktm deploy/helm --namespace ktm-system --set storage.existingClaim=preserved-data)"
          ! grep -q 'kind: PersistentVolumeClaim' <<<"$existing"
          grep -q 'claimName: preserved-data' <<<"$existing"

      - name: Verify health toggle contract
        run: |
          enabled="$(helm template ktm deploy/helm --namespace ktm-system)"
          grep -q -- '- --health-addr=:8080' <<<"$enabled"
          grep -q 'containerPort: 8080' <<<"$enabled"
          grep -q 'livenessProbe:' <<<"$enabled"
          grep -q 'readinessProbe:' <<<"$enabled"

          disabled="$(helm template ktm deploy/helm --namespace ktm-system --set agent.health.enabled=false)"
          grep -q -- '- --health-addr=$' <<<"$disabled"
          ! grep -q 'containerPort: 8080' <<<"$disabled"
          ! grep -q 'livenessProbe:' <<<"$disabled"
          ! grep -q 'readinessProbe:' <<<"$disabled"
