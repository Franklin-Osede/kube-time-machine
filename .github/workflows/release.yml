# Release workflow.
# Triggered when a tag matching v* is pushed. Produces three artefacts,
# all under the same version derived from the tag:
#
#   1. Multi-arch ktm-agent image (linux/amd64 + linux/arm64) pushed to
#      GHCR. Multi-arch is on by default because ARM nodes (Apple Silicon,
#      Graviton, Ampere) are routine in 2026; see ADR-0007.
#   2. ktm AND ktm-agent binaries for linux/macOS/Windows × amd64/arm64,
#      attached as assets to the GitHub Release. Both are needed for Mode A
#      (local-first): ktm-agent records, ktm queries.
#   3. Helm chart pushed to GHCR as an OCI artefact, with chart.version
#      and app.version pinned to the tag (kept coupled pre-v1.0; see
#      ADR-0007).
#
# GHCR-only — Docker Hub mirror is deliberately out of scope for the MVP
# (extra secret, extra surface; can be added in a follow-up).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release and upload assets
  packages: write   # to push to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Agent image (multi-arch → GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI repository names MUST be lowercase (distribution spec). The
      # GitHub-supplied ${{ github.repository_owner }} preserves case, so
      # we lowercase it here before composing any GHCR reference.
      - name: Derive version, lowercase owner, compute image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          REPO="${{ env.REGISTRY }}/${OWNER,,}/ktm-agent"
          {
            echo "version=${VERSION}"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

          # Always publish the version tag. Only move :latest for stable
          # releases — a prerelease tag (anything with a hyphen, e.g.
          # v0.1.1-rc.1) must NOT repoint :latest at an RC build.
          TAGS="${REPO}:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"${REPO}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  cli:
    name: ktm + ktm-agent binaries (5 platforms)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned explicitly rather than inferred from go.mod: released
          # binaries must be built by a toolchain with the stdlib advisories
          # fixed. go.mod's 'go' directive is the 1.26.0 floor client-go
          # requires, and building with exactly 1.26.0 would ship the
          # vulnerable net/http, crypto/tls, net/url and encoding/asn1.
          go-version: '1.26.6'
          cache: true

      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Mode A (local-first, the recommended/demo path) runs BOTH binaries
      # on the user's machine: ktm-agent records, ktm queries. Publishing
      # only ktm would leave that path uninstallable from a release, so we
      # build and attach both for every platform.
      - name: Build ktm and ktm-agent
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          for pkg in ktm agent; do
            out="$pkg"
            [ "$pkg" = "agent" ] && out="ktm-agent"
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }}" \
              -o "dist/${out}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" "./cmd/${pkg}"
          done

      - name: Upload artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  chart:
    name: Helm chart (OCI → GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Lowercase the owner for the same OCI-spec reason as in the image
      # job — GHCR rejects mixed-case references.
      - name: Derive version and lowercase owner
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "version=${GITHUB_REF#refs/tags/v}"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Package chart (chart version + appVersion pinned to tag)
        run: |
          helm package deploy/helm \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}"

      - name: Push chart
        run: |
          helm push "kube-time-machine-${{ steps.meta.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [image, cli, chart]
    steps:
      - name: Download all CLI artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefacts

      - name: Flatten artefacts into a single dir
        run: |
          mkdir -p release
          find artefacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum ./* > checksums.txt

      - name: Create release with binaries and checksums attached
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          # Mark hyphenated tags (e.g. v0.1.1-rc.1) as prereleases so they
          # don't become the repo's "Latest release", matching the :latest
          # image-tag guard above.
          prerelease: ${{ contains(github.ref_name, '-') }}
